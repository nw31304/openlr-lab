[package]
name    = "openlr-wasm"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# All five resolve to the sibling ../../../openlr-core checkout via the
# [patch] section in the workspace root Cargo.toml -- the git URL here is
# what makes the manifest itself portable (anyone without that sibling
# checkout, or CI, falls back to actually fetching openlr-core from GitHub)
# even though local day-to-day builds never touch the network, since the
# patch is always active for whoever has openlr-core checked out alongside
# this repo. See CLAUDE.md for why this is preferred over a bare path dep.
openlr-codec    = { git = "https://github.com/nw31304/openlr-core.git", branch = "main" }
openlr-engine   = { git = "https://github.com/nw31304/openlr-core.git", branch = "main" }
openlr-provider = { git = "https://github.com/nw31304/openlr-core.git", branch = "main" }
openlr-graph    = { git = "https://github.com/nw31304/openlr-core.git", branch = "main" }
openlr-encoder  = { git = "https://github.com/nw31304/openlr-core.git", branch = "main" }
serde.workspace     = true
serde_json          = "1"
wasm-bindgen        = "0.2"
console_error_panic_hook = "0.1"
