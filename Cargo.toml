[workspace]
resolver = "2"
members  = [
    "crates/openlr-wasm",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

# The engine crates (openlr-codec/graph/engine/encoder/provider) live in the
# sibling openlr-core repo now -- https://github.com/nw31304/openlr-core.
# This local path override is what makes openlr-wasm's git dependencies on
# them (see crates/openlr-wasm/Cargo.toml) resolve to your own working copy
# instead of fetching from GitHub, so an edit there shows up here immediately
# on the next build. Requires openlr-core checked out as a sibling directory
# of this repo (../openlr-core relative to here) -- see CLAUDE.md. Remove
# this section (or comment it out) to build against whatever's actually
# pushed to openlr-core's main branch instead.
[patch."https://github.com/nw31304/openlr-core.git"]
openlr-codec    = { path = "../openlr-core/crates/openlr-codec" }
openlr-graph    = { path = "../openlr-core/crates/openlr-graph" }
openlr-engine   = { path = "../openlr-core/crates/openlr-engine" }
openlr-encoder  = { path = "../openlr-core/crates/openlr-encoder" }
openlr-provider = { path = "../openlr-core/crates/openlr-provider" }
